name: Odin pull requests, built for Android

# Each branch of upstream/branches.txt, from the fork Laurent-67370/Odin,
# built alone for Android (libmain.so): the pull requests to Odin build
# on their own
on:
  push:
    paths: ['upstream/**', '.github/workflows/upstream-check.yml']
  workflow_dispatch:

jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(grep -v '^#' upstream/branches.txt | grep . | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  android:
    needs: branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.branches.outputs.list) }}
    steps:
      - name: Tools (glslangValidator for the shaders)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q glslang-tools gawk ninja-build
      - name: The branch, with its submodules
        run: |
          git clone --depth 1 --branch "${{ matrix.branch }}" https://github.com/Laurent-67370/Odin.git odin
          git -C odin submodule update --init --depth 1
          git -C odin log --oneline -1
      - name: Odin for Android (arm64)
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          cmake -S odin -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DANDROID_STL=c++_shared \
            -DODIN_BUNDLED_LIBS=ON -DODIN_NATIVE=OFF -DODIN_LTO=OFF \
            -DGLSLANG=/usr/bin/glslangValidator -DAWK=/usr/bin/awk
          ninja -C build -k 0 odin
          ls -l build/bin/libmain.so build/libmain.so 2>/dev/null || find build -name 'libmain.so' -exec ls -l {} +
